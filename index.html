<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FallTech Store — Smartphones et high-tech authentiques au Sénégal</title>
    <meta
      name="description"
      content="Smartphones, accessoires et objets connectés authentiques, garantis 24 mois. Livraison 48h à Dakar et dans tout le Sénégal. Paiement Orange Money, Wave, carte ou à la livraison."
    />
    <meta name="theme-color" content="#05060A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Polices auto-hébergées. On ne précharge que les deux fichiers du premier
         rendu : la graisse du H1 (souvent l'élément LCP) et le latin d'Inter,
         qui porte tout le texte courant. Les autres sont chargés à la demande
         via leur unicode-range. -->
    <link
      rel="preload"
      href="/fonts/ClashDisplay-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FallTech Store" />
    <meta property="og:locale" content="fr_SN" />
    <meta property="og:title" content="FallTech Store — La tech, sans le superflu." />
    <meta
      property="og:description"
      content="Smartphones et accessoires authentiques, garantis 24 mois. Livraison 48h partout au Sénégal."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Anti-FOUC : on applique le thème avant le premier rendu, donc avant que
      // React ne démarre. Sans cela, un utilisateur en thème clair voit un
      // flash noir à chaque chargement.
      (function () {
        try {
          var stored = localStorage.getItem('falltech-ui');
          var theme = stored && JSON.parse(stored).state && JSON.parse(stored).state.theme;
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
